<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96">
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2418"/>
      <stop offset="0.52" stop-color="#17140f"/>
      <stop offset="1" stop-color="#090806"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ca6a"/>
      <stop offset="0.5" stop-color="#786036"/>
      <stop offset="1" stop-color="#2b2215"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <style>
      .label { font: 12px Arial, sans-serif; fill: #cfc8b8; text-anchor: middle; }
      .mini { font: 10px Arial, sans-serif; fill: #9e947f; text-anchor: middle; }
      .gold { fill: #f4d56d; filter: url(#shadow); }
      .dark { fill: #080706; opacity: .65; }
      .stroke { fill: none; stroke: #f4d56d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
      .thin { fill: none; stroke: #f4d56d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="420" height="96" fill="#12100b"/>
  <text x="210" y="14" class="mini">small-button concept: clear silhouettes, gold on dark</text>

  <!-- reusable button frames drawn manually to keep this file simple -->
  <g transform="translate(48 22)">
    <rect x="0" y="0" width="48" height="48" fill="url(#edge)"/>
    <rect x="3" y="3" width="42" height="42" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M6 6h18M6 6v18M42 42H24M42 42V24" fill="none" stroke="#caa95a" stroke-width="2"/>
    <!-- default: star, readable even at 16px -->
    <path class="gold" d="M24 8l4.2 10.5 11.2.8-8.6 7.2 2.9 10.9L24 31.4l-9.7 6 2.9-10.9-8.6-7.2 11.2-.8z"/>
    <text x="24" y="66" class="label">default</text>
  </g>

  <g transform="translate(126 22)">
    <rect x="0" y="0" width="48" height="48" fill="url(#edge)"/>
    <rect x="3" y="3" width="42" height="42" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M6 6h18M6 6v18M42 42H24M42 42V24" fill="none" stroke="#caa95a" stroke-width="2"/>
    <!-- rules: large checkbox, no tiny parchment detail -->
    <rect x="12" y="11" width="24" height="27" rx="2" class="thin"/>
    <path class="stroke" d="M17 25l5 6 11-14"/>
    <text x="24" y="66" class="label">rules</text>
  </g>

  <g transform="translate(204 22)">
    <rect x="0" y="0" width="48" height="48" fill="url(#edge)"/>
    <rect x="3" y="3" width="42" height="42" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M6 6h18M6 6v18M42 42H24M42 42V24" fill="none" stroke="#caa95a" stroke-width="2"/>
    <!-- service: bell silhouette -->
    <path class="gold" d="M23 10h4v4c6 1.3 9 6.1 9 14v5h4v4H8v-4h4v-5c0-7.9 3-12.7 9-14z"/>
    <path class="dark" d="M16 31h16v2H16z"/>
    <circle class="gold" cx="24" cy="40" r="3"/>
    <text x="24" y="66" class="label">service</text>
  </g>

  <g transform="translate(282 22)">
    <rect x="0" y="0" width="48" height="48" fill="url(#edge)"/>
    <rect x="3" y="3" width="42" height="42" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M6 6h18M6 6v18M42 42H24M42 42V24" fill="none" stroke="#caa95a" stroke-width="2"/>
    <!-- food: crossed fork and knife, chunkier than realistic utensils -->
    <path class="stroke" d="M15 10v14M10 10v10c0 4 5 4 5 0V10M20 10v10c0 4-5 4-5 0"/>
    <path class="stroke" d="M15 25v13"/>
    <path class="gold" d="M33 9c5 8 3 15-2 20l5 9-4 2-5-10c-2-1-4-3-5-5 6-3 9-9 11-16z"/>
    <text x="24" y="66" class="label">food</text>
  </g>
</svg>
