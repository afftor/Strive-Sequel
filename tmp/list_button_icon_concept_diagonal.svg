<svg xmlns="http://www.w3.org/2000/svg" width="520" height="92" viewBox="0 0 520 92">
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2418"/>
      <stop offset="0.52" stop-color="#17140f"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ca6a"/>
      <stop offset="0.52" stop-color="#806738"/>
      <stop offset="1" stop-color="#2c2214"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.85"/>
    </filter>
    <style>
      .label { font: 12px Arial, sans-serif; fill: #cfc8b8; text-anchor: middle; }
      .mini { font: 10px Arial, sans-serif; fill: #9e947f; text-anchor: middle; }
      .gold { fill: #f4d56d; filter: url(#shadow); }
      .dark { fill: #080706; opacity: .65; }
      .stroke { fill: none; stroke: #f4d56d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
      .thin { fill: none; stroke: #f4d56d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="520" height="92" fill="#12100b"/>
  <text x="260" y="13" class="mini">diagonal 1.8:1 tabs; icon centered in visual mass</text>

  <!-- button: outer 64x36 parallelogram, inner inset parallelogram -->
  <g transform="translate(52 24)">
    <path d="M9 0h64l-9 36H0z" fill="url(#edge)"/>
    <path d="M11 3h57l-7 30H4z" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M14 6h17M7 28l5-20M62 30H45M68 8l-5 20" fill="none" stroke="#caa95a" stroke-width="2"/>
    <g transform="translate(32 18) scale(.8)">
      <path class="gold" d="M0-17l4.2 10.5 11.2.8-8.6 7.2 2.9 10.9L0 6.4l-9.7 6 2.9-10.9-8.6-7.2 11.2-.8z"/>
    </g>
    <text x="32" y="55" class="label">default</text>
  </g>

  <g transform="translate(154 24)">
    <path d="M9 0h64l-9 36H0z" fill="url(#edge)"/>
    <path d="M11 3h57l-7 30H4z" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M14 6h17M7 28l5-20M62 30H45M68 8l-5 20" fill="none" stroke="#caa95a" stroke-width="2"/>
    <g transform="translate(32 18) scale(.78)">
      <rect x="-12" y="-14" width="24" height="27" rx="2" class="thin"/>
      <path class="stroke" d="M-7 0l5 6 11-14"/>
    </g>
    <text x="32" y="55" class="label">rules</text>
  </g>

  <g transform="translate(256 24)">
    <path d="M9 0h64l-9 36H0z" fill="url(#edge)"/>
    <path d="M11 3h57l-7 30H4z" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M14 6h17M7 28l5-20M62 30H45M68 8l-5 20" fill="none" stroke="#caa95a" stroke-width="2"/>
    <g transform="translate(32 17) scale(.76)">
      <path class="gold" d="M-1-16h4v4c6 1.3 9 6.1 9 14v5h4v4h-32V7h4V2c0-7.9 3-12.7 9-14z"/>
      <path class="dark" d="M-8 5H8v2H-8z"/>
      <circle class="gold" cx="0" cy="14" r="3"/>
    </g>
    <text x="32" y="55" class="label">service</text>
  </g>

  <g transform="translate(358 24)">
    <path d="M9 0h64l-9 36H0z" fill="url(#edge)"/>
    <path d="M11 3h57l-7 30H4z" fill="url(#button)" stroke="#392d1b" stroke-width="2"/>
    <path d="M14 6h17M7 28l5-20M62 30H45M68 8l-5 20" fill="none" stroke="#caa95a" stroke-width="2"/>
    <g transform="translate(32 17) scale(.72)">
      <path class="stroke" d="M-9-14V0M-14-14v10c0 4 5 4 5 0v-10M-4-14v10c0 4-5 4-5 0"/>
      <path class="stroke" d="M-9 1v13"/>
      <path class="gold" d="M9-15c5 8 3 15-2 20l5 9-4 2-5-10c-2-1-4-3-5-5 6-3 9-9 11-16z"/>
    </g>
    <text x="32" y="55" class="label">food</text>
  </g>
</svg>
