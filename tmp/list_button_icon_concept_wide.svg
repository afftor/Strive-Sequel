<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64">
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#342a1a"/>
      <stop offset="0.48" stop-color="#19140d"/>
      <stop offset="1" stop-color="#070604"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d889"/>
      <stop offset="0.42" stop-color="#8e743e"/>
      <stop offset="1" stop-color="#241b10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <style>
      .gold { fill: #f5d765; filter: url(#shadow); }
      .cut { fill: #070604; opacity: .68; }
      .stroke { fill: none; stroke: #f5d765; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
      .thin { fill: none; stroke: #f5d765; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#shadow); }
      .label { font: 11px Arial, sans-serif; fill: #bdb39d; text-anchor: middle; }
    </style>
  </defs>

  <rect width="420" height="64" fill="#100d08"/>

  <!-- Wide minor-GUI buttons: 72 x 40, ratio 1.8:1. -->
  <g transform="translate(18 10)">
    <rect x="0" y="0" width="72" height="40" fill="url(#rim)"/>
    <rect x="3" y="3" width="66" height="34" fill="url(#button)" stroke="#42321b" stroke-width="2"/>
    <path d="M6 6h18M6 6v12M66 34H48M66 34V22" fill="none" stroke="#cfad5c" stroke-width="2"/>
    <path d="M13 34H31" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <path d="M41 34h18" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <!-- default -->
    <path class="gold" d="M36 7l4 9.2 10 .8-7.5 6.2 2.4 9.8-8.9-5.3-8.9 5.3 2.4-9.8L22 17l10-.8z"/>
    <text x="36" y="58" class="label">default</text>
  </g>

  <g transform="translate(116 10)">
    <rect x="0" y="0" width="72" height="40" fill="url(#rim)"/>
    <rect x="3" y="3" width="66" height="34" fill="url(#button)" stroke="#42321b" stroke-width="2"/>
    <path d="M6 6h18M6 6v12M66 34H48M66 34V22" fill="none" stroke="#cfad5c" stroke-width="2"/>
    <path d="M13 34H31" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <path d="M41 34h18" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <!-- rules -->
    <rect x="22" y="9" width="23" height="24" rx="2" class="thin"/>
    <path class="stroke" d="M27 22l5 6 13-15"/>
    <text x="36" y="58" class="label">rules</text>
  </g>

  <g transform="translate(214 10)">
    <rect x="0" y="0" width="72" height="40" fill="url(#rim)"/>
    <rect x="3" y="3" width="66" height="34" fill="url(#button)" stroke="#42321b" stroke-width="2"/>
    <path d="M6 6h18M6 6v12M66 34H48M66 34V22" fill="none" stroke="#cfad5c" stroke-width="2"/>
    <path d="M13 34H31" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <path d="M41 34h18" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <!-- service -->
    <path class="gold" d="M34 8h4v3c6.3 1 9.5 5.2 9.5 12.5v4h4v4h-31v-4h4v-4c0-7.3 3.2-11.5 9.5-12.5z"/>
    <path class="cut" d="M29 25h14v2H29z"/>
    <circle class="gold" cx="36" cy="34" r="3"/>
    <text x="36" y="58" class="label">service</text>
  </g>

  <g transform="translate(312 10)">
    <rect x="0" y="0" width="72" height="40" fill="url(#rim)"/>
    <rect x="3" y="3" width="66" height="34" fill="url(#button)" stroke="#42321b" stroke-width="2"/>
    <path d="M6 6h18M6 6v12M66 34H48M66 34V22" fill="none" stroke="#cfad5c" stroke-width="2"/>
    <path d="M13 34H31" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <path d="M41 34h18" fill="none" stroke="#4d3b20" stroke-width="2"/>
    <!-- food -->
    <path class="stroke" d="M28 8v13M22 8v9c0 4.5 6 4.5 6 0V8M34 8v9c0 4.5-6 4.5-6 0"/>
    <path class="stroke" d="M28 22v12"/>
    <path class="gold" d="M47 7c4.7 7.5 3.1 14.2-2.3 19.4l4.8 7.6-4.3 2.1-5.1-8.7c-2.2-1-4-2.9-5-5.3C41.1 19.3 44.4 13.9 47 7z"/>
    <text x="36" y="58" class="label">food</text>
  </g>
</svg>
